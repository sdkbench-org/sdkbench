[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdkbench"
version = "0.1.0"
description = "Reproducible SDK performance and correctness benchmarks, starting with quantum development kits"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "SDKBench contributors"}]
keywords = ["benchmark", "SDK", "quantum", "performance", "qiskit", "cirq"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.2,<3"]
cirq = ["cirq-core>=1.4,<2"]
all = ["qiskit>=1.2,<3", "cirq-core>=1.4,<2"]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/sdkbench-org/sdkbench"
Repository = "https://github.com/sdkbench-org/sdkbench"
Issues = "https://github.com/sdkbench-org/sdkbench/issues"

[project.scripts]
sdkbench = "sdkbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
