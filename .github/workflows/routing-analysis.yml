name: Routing attribution controls
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/sdkbench/diagnostics/**'
      - 'tools/routing_attribution.py'
      - 'docs/analysis/routing-profile.json'
      - '.github/workflows/routing-analysis.yml'
permissions:
  contents: read
jobs:
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      SDKBENCH_REQUIRE_ROUTING: '1'
      MPLCONFIGDIR: /tmp/sdkbench-routing-matplotlib
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12.14'
      - name: Install pinned CPU numerical backend
        run: python -m pip install 'torch==2.14.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install all three pinned SDKs and SDKBench
        run: python -m pip install '.[p1b,dev]'
      - name: Test all native instance sizes and failure accounting
        run: python -m pytest tests/test_routing_diagnostics.py -q
      - name: Delegate a disposable cgroup subtree
        run: |
          sudo sh -c 'echo "+memory +cpu +cpuset +pids" > /sys/fs/cgroup/cgroup.subtree_control'
          sudo mkdir /sys/fs/cgroup/sdkbench-routing-ci
          sudo sh -c 'echo "+memory +cpu +cpuset +pids" > /sys/fs/cgroup/sdkbench-routing-ci/cgroup.subtree_control'
          sudo mkdir /sys/fs/cgroup/sdkbench-routing-ci/operator
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/sdkbench-routing-ci
      - name: Execute every declared routing configuration and microprobe
        run: |
          sudo sh -c "echo $$ > /sys/fs/cgroup/sdkbench-routing-ci/operator/cgroup.procs"
          python tools/routing_attribution.py --directory routing-evidence --cgroup-parent /sys/fs/cgroup/sdkbench-routing-ci
      - name: Retain all successes, unsupported outcomes and failures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: routing-attribution-evidence
          path: routing-evidence
          if-no-files-found: warn
          retention-days: 90
      - name: Check descendant cleanup
        if: always()
        run: |
          if test -d /sys/fs/cgroup/sdkbench-routing-ci/operator; then sudo rmdir /sys/fs/cgroup/sdkbench-routing-ci/operator; fi
          if test -d /sys/fs/cgroup/sdkbench-routing-ci; then
            test -z "$(find /sys/fs/cgroup/sdkbench-routing-ci -mindepth 1 -type d -print)"
            sudo rmdir /sys/fs/cgroup/sdkbench-routing-ci
          fi
