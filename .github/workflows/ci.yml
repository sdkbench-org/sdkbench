name: Tests and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: sdkbench run --qubits 3 --repeats 1 --output smoke.json
  sdks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[all,dev]'
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: sdkbench run --sdk qiskit --sdk cirq --qubits 4 --repeats 2 --output smoke.json --csv smoke.csv
